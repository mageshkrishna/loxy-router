<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- background + subtle panel tints -->
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="720" fill="#fef6f6"/>
  <rect x="640" y="0" width="640" height="720" fill="#f3fdf7"/>
  <line x1="640" y1="70" x2="640" y2="650" stroke="#e5e7eb" stroke-width="2"/>

  <!-- title -->
  <text x="640" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">Plain load balancer  vs.  LoxyRouter</text>
  <text x="640" y="74" text-anchor="middle" font-size="15" fill="#6b7280">Measured · qwen3:32b on NVIDIA A40 — truly cold load 70 s · reload from page cache ~8 s · warm hit ~1 s</text>

  <!-- ============ LEFT: plain load balancer ============ -->
  <text x="320" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#b91c1c">nginx / HAProxy · round-robin</text>

  <!-- client -->
  <rect x="60" y="252" width="120" height="66" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="291" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">Client</text>

  <!-- arrows (scattered to both backends) -->
  <line x1="184" y1="276" x2="352" y2="220" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="184" y1="294" x2="352" y2="376" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- backend A -->
  <rect x="358" y="176" width="212" height="92" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.75"/>
  <text x="464" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Backend A</text>
  <text x="464" y="240" text-anchor="middle" font-size="14" fill="#b91c1c">reloading models…</text>

  <!-- backend B -->
  <rect x="358" y="330" width="212" height="92" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.75"/>
  <text x="464" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Backend B</text>
  <text x="464" y="394" text-anchor="middle" font-size="14" fill="#b91c1c">reloading models…</text>

  <!-- banner -->
  <rect x="44" y="470" width="552" height="74" rx="10" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="320" y="502" text-anchor="middle" font-size="15" fill="#7f1d1d">Routes by request count, not model warmth → constant swaps</text>
  <text x="320" y="528" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">Worst case: 70 s per request (32B cold load)</text>

  <!-- ============ RIGHT: LoxyRouter ============ -->
  <text x="960" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#15803d">LoxyRouter · warmth-aware</text>

  <!-- client -->
  <rect x="700" y="252" width="120" height="66" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="760" y="291" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">Client</text>

  <!-- arrows (clean, model-matched) -->
  <line x1="824" y1="276" x2="992" y2="220" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="824" y1="294" x2="992" y2="376" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="905" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">llama</text>
  <text x="905" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">qwen</text>

  <!-- backend A -->
  <rect x="998" y="176" width="212" height="92" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.75"/>
  <text x="1104" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Backend A</text>
  <circle cx="1058" cy="236" r="5" fill="#16a34a"/>
  <text x="1070" y="241" text-anchor="start" font-size="14" font-weight="600" fill="#166534">llama — WARM</text>

  <!-- backend B -->
  <rect x="998" y="330" width="212" height="92" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.75"/>
  <text x="1104" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Backend B</text>
  <circle cx="1062" cy="390" r="5" fill="#16a34a"/>
  <text x="1074" y="395" text-anchor="start" font-size="14" font-weight="600" fill="#166534">qwen — WARM</text>

  <!-- banner -->
  <rect x="684" y="470" width="552" height="74" rx="10" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="960" y="502" text-anchor="middle" font-size="15" fill="#14532d">Each model stays resident on the backend that holds it</text>
  <text x="960" y="528" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Warm hit: ~1 s per request</text>
</svg>
